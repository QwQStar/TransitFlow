server:
  port: 8080

spring:
  application:
    name: transitflow
  datasource:
    url: jdbc:mysql://localhost:3306/transitflow?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: transitflow
    password: transitflow
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: transitflow-ingest
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: record

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

transitflow:
  topics:
    ingest: transitflow.ingest
    dlq: transitflow.ingest.dlq
  simulator:
    enabled: true
    interval-ms: 1000
    devices-per-source: 8
    poison-rate: 0.02
  dedup-ttl-seconds: 600
  reconcile-ms: 15000
